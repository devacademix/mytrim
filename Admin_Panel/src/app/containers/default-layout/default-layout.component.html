<!--sidebar-->
<c-sidebar #sidebar="cSidebar" class="d-print-none sidebar sidebar-fixed" id="sidebar" [(visible)]="sidebarVisible" breakpoint="md">
  <c-sidebar-brand [brandFull]="{
      src: 'assets/img/brand/big_logo.png',
      width: 180,
      height: 48,
      alt: 'MyTrim Logo'
    }" [brandNarrow]="{
      src: 'assets/img/brand/big_logo.png',
      width: 50,
      height: 50,
      alt: 'MyTrim Logo'
    }" routerLink="./">
  </c-sidebar-brand>
  <c-sidebar-nav [navItems]="navItems">
  </c-sidebar-nav>
  <c-sidebar-toggler *ngIf="!sidebar.narrow" toggle="unfoldable" cSidebarToggle="sidebar"></c-sidebar-toggler>
</c-sidebar>

<!--main-->
<div class="wrapper d-flex flex-column min-vh-100 bg-light dark:bg-transparent">
  <!--app-header-->
  <app-default-header class="mb-4 d-print-none header header-sticky" position="sticky" sidebarId="sidebar">
  </app-default-header>
  <!--app-body-->
  <div class="body flex-grow-1 px-3">
    <c-container breakpoint="lg" class="h-auto">
      <router-outlet></router-outlet>
    </c-container>
  </div>
  <!--app footer-->
  <app-default-footer></app-default-footer>
</div>
