name: user
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.4.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  http: ^1.2.1
  shared_preferences: ^2.2.3
  flutter_skeleton_ui: ^0.0.6
  carousel_slider: ^5.1.2
  get: ^4.6.6
  country_code_picker: ^3.0.0
  google_maps_flutter: ^2.7.0
  flutter_switch: ^0.3.2
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  url_launcher: ^6.3.0
  share_plus: ^11.0.0
  date_picker_timeline: ^1.2.6
  jiffy: ^6.3.1
  connectivity_plus: ^6.0.3
  flutter_multi_formatter: ^2.12.8
  webview_flutter: ^4.8.0
  geocoding: ^3.0.0
  google_nav_bar: ^5.0.6
  flutter_widget_from_html: ^0.17.2
  flutter_otp_text_field: ^1.1.3+2
  badges: ^3.1.2
  change_app_package_name: ^1.2.0
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/mytrim_logo.jpeg"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/mytrim_logo.jpeg"

flutter:
  uses-material-design: true

  assets:
    - assets/sliders/
    - assets/images/

  fonts:
    - family: bold
      fonts:
        - asset: assets/fonts/Poppins-Bold.ttf

    - family: semibold
      fonts:
        - asset: assets/fonts/Poppins-SemiBold.ttf

    - family: medium
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf

    - family: regular
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf

dependency_overrides:
  video_player_android: ^2.12.0
