buildscript {
    ext.kotlin_version = '2.0.0'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.0'  // Use the latest version available
        classpath 'com.google.gms:google-services:4.3.15'  // Use the latest version available
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

subprojects {
    project.plugins.withId("com.android.library") {
        def android = project.extensions.findByName("android")
        if (android != null && android.namespace == null) {
            android.namespace = "io.saundarya." + project.name.replaceAll("[^a-zA-Z0-9_]", "")
        }
    }
    project.plugins.withId("com.android.application") {
        def android = project.extensions.findByName("android")
        if (android != null && android.namespace == null) {
            android.namespace = "io.saundarya." + project.name.replaceAll("[^a-zA-Z0-9_]", "")
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
