version: '3.8'
services:

  # PHP-FPM Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: salonhub-api-app
    container_name: salonhub-api-app
    restart: unless-stopped
    tty: true
    working_dir: /var/web
    volumes:
      - ./:/var/web
    networks:
      - salonhub-api-network

  # Nginx Web Server Service
  webserver:
    image: nginx:alpine
    container_name: salonhub-api-webserver
    restart: unless-stopped
    tty: true
    ports:
      - "8001:80"
    volumes:
      - ./:/var/web
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - salonhub-api-network
    depends_on:
      - app

  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: salonhub-api-db
    restart: unless-stopped
    tty: true
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: salon_api
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - salonhub-api-network

# Docker Networks
networks:
  salonhub-api-network:
    driver: bridge

# Volumes
volumes:
  dbdata:
    driver: local
