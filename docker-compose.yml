version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: salonhub-api-db
    restart: unless-stopped
    tty: true
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: salon_api
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - salonhub-network

  # PHP-FPM Application Service
  app:
    build:
      context: ./API
      dockerfile: Dockerfile
    image: salonhub-api-app
    container_name: salonhub-api-app
    restart: unless-stopped
    tty: true
    working_dir: /var/web
    volumes:
      - ./API:/var/web
    networks:
      - salonhub-network
    depends_on:
      - db

  # Nginx Web Server for API
  webserver:
    image: nginx:alpine
    container_name: salonhub-api-webserver
    restart: unless-stopped
    tty: true
    ports:
      - "8001:80"
    volumes:
      - ./API:/var/web
      - ./API/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - salonhub-network
    depends_on:
      - app

  # Admin Panel Application (Angular served via Nginx)
  admin-panel:
    build:
      context: ./Admin_Panel
      dockerfile: Dockerfile
    image: salonhub-admin-panel
    container_name: salonhub-admin-panel
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - salonhub-network
    depends_on:
      - webserver

networks:
  salonhub-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
